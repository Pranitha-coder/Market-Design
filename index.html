<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Urban Market Street | 360 VR Experience</title>
  
  <!-- A-Frame VR Framework -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ================= 1. WELCOME SCREEN ================= -->
  <section id="welcome-screen">
    <div class="welcome-header">
      <h1 data-i18n="title">Market Street Architectural Walkthrough</h1>
      <p data-i18n="subtitle">Urban Redesign & Street Revitalization | Virtual Reality Experience</p>
    </div>

    <div class="welcome-footer">
      <button id="btn-start" class="btn-start" data-i18n="start">START TOUR</button>
    </div>
  </section>

  <!-- ================= 2. SITE / SCENE TITLE BADGE ================= -->
  <div id="scene-indicator">
    <span id="current-scene-title">Pedestrian Street</span>
  </div>

  <!-- ================= 3. LEFT TRANSLUCENT SIDEBAR ================= -->
  <nav id="sidebar-menu">
    <button class="menu-item" id="btn-home" title="Home View">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      <span data-i18n="menu_home">Home</span>
    </button>

    <button class="menu-item" id="btn-siteplan" title="Site Plan">
      <svg viewBox="0 0 24 24"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon><line x1="8" y1="2" x2="8" y2="18"></line><line x1="16" y1="6" x2="16" y2="22"></line></svg>
      <span data-i18n="menu_plan">Site Plan</span>
    </button>

    <button class="menu-item" id="btn-vr" title="Enter VR Mode">
      <svg viewBox="0 0 24 24"><path d="M4 7h16a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-3l-2.5-3h-5L7 17H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z"></path><circle cx="8" cy="12" r="1.5"></circle><circle cx="16" cy="12" r="1.5"></circle></svg>
      <span data-i18n="menu_vr">VR Mode</span>
    </button>

    <button class="menu-item" id="btn-lang" title="Toggle Language">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
      <span id="lang-label">EN / TE</span>
    </button>
  </nav>

  <!-- ================= 4. SITE PLAN MODAL OVERLAY ================= -->
  <div id="siteplan-modal" class="hidden">
    <div class="modal-content">
      <button class="btn-close" id="btn-close-plan">&times;</button>
      <h2 style="margin-bottom: 12px;" data-i18n="siteplan_title">Urban Master Plan</h2>
      <p style="color: var(--text-sub); margin-bottom: 20px;" data-i18n="siteplan_desc">Select a station marker below to jump directly to that vantage point.</p>
      <div style="border: 2px dashed rgba(255,255,255,0.2); padding: 40px 20px; border-radius: 12px;">
        <button class="btn-start" style="padding: 8px 16px; font-size: 0.8rem; margin: 5px;" onclick="switchScene('node-1'); document.getElementById('siteplan-modal').classList.add('hidden');">Station 1: Pedestrian Area</button>
        <button class="btn-start" style="padding: 8px 16px; font-size: 0.8rem; margin: 5px;" onclick="switchScene('node-2'); document.getElementById('siteplan-modal').classList.add('hidden');">Station 2: Bike Crossing</button>
      </div>
    </div>
  </div>

  <!-- ================= 5. A-FRAME WEBXR 3D SCENE ================= -->
  <a-scene embedded loading-screen="dotsColor: #2ecc71; backgroundColor: #0b0f14" vr-mode-ui="enabled: false">
    
    <!-- 360 Panorama Projection Sphere -->
    <a-sky id="skybox" radius="100" rotation="0 0 0"></a-sky>

    <!-- Waypoint Container -->
    <a-entity id="waypoint-group"></a-entity>

    <!-- Camera Rig & Controls -->
    <a-entity id="rig" position="0 1.6 0">
      <a-camera id="head" look-controls="pointerLockEnabled: false">
        <a-cursor
          id="cursor"
          geometry="primitive: ring; radiusInner: 0.015; radiusOuter: 0.025"
          material="color: #ffffff; shader: flat; opacity: 0.8"
          animation__fuse="property: scale; startEvents: fusing; easing: easeInCubic; dur: 1200; from: 1 1 1; to: 0.2 0.2 0.2"
          raycaster="objects: .clickable">
        </a-cursor>
      </a-camera>

      <!-- Meta Quest Laser Pointers -->
      <a-entity laser-controls="hand: right" raycaster="objects: .clickable; lineColor: #2ecc71; lineOpacity: 0.8"></a-entity>
      <a-entity laser-controls="hand: left" raycaster="objects: .clickable; lineColor: #2ecc71; lineOpacity: 0.8"></a-entity>
    </a-entity>
  </a-scene>

  <!-- ================= 6. JAVASCRIPT CONTROLLER ================= -->
  <script>
    const translations = {
      en: {
        title: "Market Street Architectural Walkthrough",
        subtitle: "Urban Redesign & Street Revitalization | Virtual Reality Experience",
        start: "START TOUR",
        menu_home: "Home",
        menu_plan: "Site Plan",
        menu_vr: "VR Mode",
        siteplan_title: "Urban Master Plan",
        siteplan_desc: "Select a station marker below to jump directly to that vantage point."
      },
      te: {
        title: "మార్కెట్ వీధి ఆర్కిటెక్చరల్ వాక్‌త్రూ",
        subtitle: "పట్టణ పునఃరూపకల్పన & వీధి అభివృద్ధి | వర్చువల్ రియాలిటీ అనుభవం",
        start: "ప్రారంభించండి",
        menu_home: "హోమ్",
        menu_plan: "ప్లాన్",
        menu_vr: "విఆర్ మోడ్",
        siteplan_title: "పట్టణ మాస్టర్ ప్లాన్",
        siteplan_desc: "ఆ ప్రదేశాన్ని చూడటానికి క్రింది స్టేషన్‌ను ఎంచుకోండి."
      }
    };

    let currentLang = 'en';
    let tourData = [];
    let activeSceneId = null;

    const sky = document.querySelector('#skybox');
    const waypointGroup = document.querySelector('#waypoint-group');
    const currentSceneTitle = document.querySelector('#current-scene-title');
    const aScene = document.querySelector('a-scene');

    async function init() {
      try {
        const response = await fetch('street-data.json');
        const data = await response.json();
        tourData = data.scenes;
        if (tourData.length > 0) {
          activeSceneId = tourData[0].id;
        }
      } catch (err) {
        console.error("Error loading tour data:", err);
      }
    }

    function switchScene(sceneId) {
      const scene = tourData.find(s => s.id === sceneId);
      if (!scene) return;
      activeSceneId = sceneId;

      sky.setAttribute('animation__fadeout', {
        property: 'material.opacity',
        to: 0,
        dur: 300,
        easing: 'easeInOutQuad'
      });

      setTimeout(() => {
        sky.setAttribute('src', scene.image);
        currentSceneTitle.innerText = scene.name[currentLang];
        renderWaypoints(scene.waypoints);

        sky.setAttribute('animation__fadein', {
          property: 'material.opacity',
          to: 1,
          dur: 300,
          easing: 'easeInOutQuad'
        });
      }, 300);
    }

    function renderWaypoints(waypoints) {
      waypointGroup.innerHTML = '';
      if (!waypoints) return;

      waypoints.forEach(wp => {
        const wpEntity = document.createElement('a-entity');
        wpEntity.setAttribute('position', wp.position);
        
        wpEntity.innerHTML = `
          <a-ring 
            class="clickable" 
            radius-inner="0.3" 
            radius-outer="0.6" 
            color="#2ecc71" 
            rotation="-90 0 0" 
            material="opacity: 0.85; transparent: true">
          </a-ring>
          <a-text 
            value="${wp.label[currentLang]}" 
            position="0 0.8 0" 
            align="center" 
            scale="0.9 0.9 0.9" 
            color="#ffffff" 
            look-at="#head">
          </a-text>
        `;

        wpEntity.querySelector('.clickable').addEventListener('click', () => {
          switchScene(wp.target);
        });

        waypointGroup.appendChild(wpEntity);
      });
    }

    function updateLanguage(lang) {
      currentLang = lang;
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (translations[lang][key]) {
          el.innerText = translations[lang][key];
        }
      });

      if (activeSceneId) {
        const scene = tourData.find(s => s.id === activeSceneId);
        if (scene) {
          currentSceneTitle.innerText = scene.name[lang];
          renderWaypoints(scene.waypoints);
        }
      }
    }

    // UI Event Handlers
    document.getElementById('btn-start').addEventListener('click', () => {
      document.getElementById('welcome-screen').classList.add('hidden');
      if (activeSceneId) switchScene(activeSceneId);
    });

    document.getElementById('btn-home').addEventListener('click', () => {
      if (tourData.length > 0) switchScene(tourData[0].id);
    });

    document.getElementById('btn-siteplan').addEventListener('click', () => {
      document.getElementById('siteplan-modal').classList.remove('hidden');
    });

    document.getElementById('btn-close-plan').addEventListener('click', () => {
      document.getElementById('siteplan-modal').classList.add('hidden');
    });

    document.getElementById('btn-vr').addEventListener('click', () => {
      // Trigger WebXR Immersive Session for Meta Quest
      if (aScene.enterVR) {
        aScene.enterVR();
      }
    });

    document.getElementById('btn-lang').addEventListener('click', () => {
      const nextLang = currentLang === 'en' ? 'te' : 'en';
      updateLanguage(nextLang);
    });

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
