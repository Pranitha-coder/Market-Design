<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Sardar Vallabhai Patel Market | 360 VR</title>
  
  <!-- A-Frame VR Framework -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>

  <style>
    :root {
      --bg-glass: rgba(15, 23, 42, 0.88);
      --border-glass: rgba(255, 255, 255, 0.2);
      --accent: #2ecc71;
      --accent-hover: #27ae60;
      --text-main: #ffffff;
      --text-sub: #cbd5e1;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      color: var(--text-main);
    }

    /* ================= 1. WELCOME SCREEN ================= */
    #welcome-screen {
      position: absolute;
      inset: 0;
      z-index: 2000;
      background-color: #0b0f14;
      background-image: 
        linear-gradient(90deg, rgba(10, 15, 25, 0.3) 0%, rgba(10, 15, 25, 0.85) 100%),
        url('./welcome-hero.jpg');
      background-position: center center;
      background-repeat: no-repeat;
      background-size: cover;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 40px 8%;
      transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.8s;
    }

    #welcome-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .welcome-card {
      background: var(--bg-glass);
      padding: 48px 42px;
      border-radius: 24px;
      border: 1px solid var(--border-glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      max-width: 540px;
      width: 100%;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      text-align: left;
      animation: fadeInRight 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .eyebrow-tag {
      font-size: 0.75rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 12px;
    }

    .welcome-card h1 {
      font-size: 2.2rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-weight: 800;
      line-height: 1.25;
      color: #ffffff;
      text-shadow: 0 4px 18px rgba(0,0,0,0.9);
      margin-bottom: 14px;
    }

    .welcome-card p {
      color: var(--text-sub);
      font-size: 0.95rem;
      letter-spacing: 1.2px;
      text-transform: lowercase;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .btn-start {
      padding: 16px 44px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #fff;
      background: rgba(46, 204, 113, 0.15);
      border: 1.5px solid var(--accent);
      border-radius: 40px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(46, 204, 113, 0.4);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: inline-flex;
      align-items: center;
      gap: 12px;
      transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .btn-start:hover {
      background: var(--accent);
      color: #0b0f14;
      box-shadow: 0 0 40px rgba(46, 204, 113, 0.85);
      transform: translateY(-2px);
    }

    /* ================= 2. TOP RIGHT INFO BUTTON & PANEL ================= */
    #info-btn {
      position: absolute;
      top: 24px;
      right: 24px;
      z-index: 500;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--bg-glass);
      border: 1.5px solid var(--accent);
      color: #ffffff;
      font-size: 1.3rem;
      font-weight: 700;
      font-style: italic;
      font-family: Georgia, "Times New Roman", serif;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 0 20px rgba(46, 204, 113, 0.35);
      transition: all 0.25s ease;
    }

    #info-btn.visible {
      display: flex;
    }

    #info-btn:hover, #info-btn.open {
      background: var(--accent);
      color: #0b0f14;
      box-shadow: 0 0 30px rgba(46, 204, 113, 0.7);
    }

    #info-panel {
      position: absolute;
      top: 86px;
      right: 24px;
      z-index: 500;
      width: min(360px, calc(100% - 48px));
      background: var(--bg-glass);
      border: 1px solid var(--border-glass);
      border-radius: 20px;
      padding: 22px 24px;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.7);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-8px);
      transition: all 0.25s ease;
    }

    #info-panel.open {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    #info-panel h3 {
      font-size: 1.1rem;
      margin-bottom: 6px;
      color: var(--accent);
    }

    #info-panel .info-tag {
      font-size: 0.72rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-sub);
      margin-bottom: 10px;
      display: block;
    }

    #info-panel p {
      font-size: 0.92rem;
      line-height: 1.6;
      color: var(--text-sub);
      user-select: text;
    }

    /* ================= 3. LEFT TRANSLUCENT MENU ================= */
    #sidebar-menu {
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 500;
      background: var(--bg-glass);
      border: 1px solid var(--border-glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 20px;
      padding: 14px 8px;
      display: none;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    #sidebar-menu.visible {
      display: flex;
    }

    .menu-item {
      background: transparent;
      border: none;
      color: var(--text-sub);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 12px;
      min-width: 64px;
      cursor: pointer;
      border-radius: 12px;
      transition: all 0.2s ease;
    }

    .menu-item svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
    }

    .menu-item span {
      font-size: 0.72rem;
      letter-spacing: 0.5px;
      font-weight: 500;
    }

    .menu-item:hover {
      background: rgba(255, 255, 255, 0.12);
      color: var(--accent);
      transform: scale(1.05);
    }

    /* ================= 4. TOP PLAN MODAL POPUP ================= */
    #siteplan-modal {
      position: absolute;
      inset: 0;
      background: rgba(2, 6, 23, 0.85);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      z-index: 1200;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.35s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.35s;
    }

    #siteplan-modal.visible {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .modal-content {
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.14);
      padding: 34px 38px;
      border-radius: 28px;
      max-width: 960px;
      width: 92%;
      max-height: 90vh;
      overflow-y: auto;
      text-align: center;
      position: relative;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9);
      transform: scale(0.95);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #siteplan-modal.visible .modal-content {
      transform: scale(1);
    }

    .btn-close {
      position: absolute;
      top: 20px;
      right: 24px;
      background: transparent;
      border: none;
      color: #cbd5e1;
      font-size: 2rem;
      cursor: pointer;
      line-height: 1;
      transition: color 0.2s ease, transform 0.2s ease;
    }

    .btn-close:hover {
      color: #fff;
      transform: scale(1.15);
    }

    .plan-viewport {
      position: relative;
      margin: 22px 0 20px 0;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: #090d16;
      min-height: 380px;
      aspect-ratio: 16 / 9;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .plan-viewport img {
      width: 100%;
      height: 100%;
      max-height: 60vh;
      object-fit: contain;
      display: block;
    }

    /* Clickable Waypoint Pins on the Plan */
    .plan-pin {
      position: absolute;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--accent);
      border: 3.5px solid #ffffff;
      transform: translate(-50%, -50%);
      cursor: pointer;
      padding: 0;
      box-shadow: 0 0 18px rgba(46, 204, 113, 0.85);
      animation: pinPulse 2s infinite ease-in-out;
      transition: transform 0.25s ease, background-color 0.2s ease;
      z-index: 10;
    }

    .plan-pin:hover, .plan-pin:focus {
      background: #ffffff;
      border-color: var(--accent);
      transform: translate(-50%, -50%) scale(1.35);
      outline: none;
    }

    .pin-label {
      position: absolute;
      bottom: 38px;
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      line-height: 1;
      padding: 8px 14px;
      border-radius: 20px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.6);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .plan-pin:hover .pin-label, .plan-pin:focus .pin-label {
      opacity: 1;
      transform: translateX(-50%) translateY(-4px);
    }

    @keyframes pinPulse {
      0% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.8); }
      70% { box-shadow: 0 0 0 16px rgba(46, 204, 113, 0); }
      100% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0); }
    }

    .location-directory {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 6px;
    }

    .dir-pill-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: #f1f5f9;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      padding: 10px 22px;
      border-radius: 30px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.25s ease;
    }

    .dir-pill-btn:hover {
      background: var(--accent);
      color: #0b0f14;
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(46, 204, 113, 0.4);
    }

    @keyframes fadeInRight {
      from { opacity: 0; transform: translateX(40px); }
      to { opacity: 1; transform: translateX(0); }
    }
  </style>
</head>
<body>

  <!-- ================= 1. WELCOME SCREEN ================= -->
  <section id="welcome-screen">
    <div class="welcome-card">
      <span class="eyebrow-tag" data-i18n="eyebrow">Virtual Reality Walkthrough</span>
      <h1 data-i18n="title">Sardar Vallabhai Patel Market</h1>
      <p data-i18n="subtitle">virtual reality experience</p>
      <button id="btn-start" class="btn-start">
        <span data-i18n="start">START TOUR</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
      </button>
    </div>
  </section>

  <!-- ================= 2. TOP RIGHT INFO BUTTON & PANEL ================= -->
  <button id="info-btn" title="Information">i</button>
  <div id="info-panel">
    <span class="info-tag" data-i18n="info_tag">About this place</span>
    <h3 id="info-title">Ariel View</h3>
    <p id="info-text">Overview of the market complex and surroundings.</p>
  </div>

  <!-- ================= 3. LEFT SIDEBAR NAVIGATION ================= -->
  <nav id="sidebar-menu">
    <button class="menu-item" id="btn-home" title="Home View">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      <span data-i18n="menu_home">Home</span>
    </button>

    <button class="menu-item" id="btn-siteplan" title="Top Plan">
      <svg viewBox="0 0 24 24"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon><line x1="8" y1="2" x2="8" y2="18"></line><line x1="16" y1="6" x2="16" y2="22"></line></svg>
      <span data-i18n="menu_plan">Top Plan</span>
    </button>

    <button class="menu-item" id="btn-vr" title="Enter VR Mode">
      <svg viewBox="0 0 24 24"><path d="M4 7h16a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-3l-2.5-3h-5L7 17H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z"></path><circle cx="8" cy="12" r="1.5"></circle><circle cx="16" cy="12" r="1.5"></circle></svg>
      <span data-i18n="menu_vr">VR Mode</span>
    </button>

    <button class="menu-item" id="btn-lang" title="Toggle Language">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
      <span id="lang-label">EN / TE</span>
    </button>
  </nav>

  <!-- ================= 4. INTERACTIVE TOP PLAN MODAL ================= -->
  <div id="siteplan-modal" role="dialog" aria-modal="true" aria-labelledby="modal-heading">
    <div class="modal-content" id="modal-box">
      <button class="btn-close" id="btn-close-plan" aria-label="Close Top Plan">&times;</button>
      <h2 id="modal-heading" data-i18n="siteplan_title" style="font-size: 1.8rem; font-weight: 700; color: #fff;">Top Plan</h2>
      <p style="color: var(--text-sub); margin-top: 6px; font-size: 0.95rem;" data-i18n="siteplan_desc">Select a location on the top plan to explore the 360° space.</p>
      
      <div class="plan-viewport">
        <img id="siteplan-img" 
             src="Site%20plan.jpg" 
             alt="Top Plan"
             onerror="if(!this.dataset.retry){this.dataset.retry=1;this.src='Site plan.jpg';}else if(this.dataset.retry==1){this.dataset.retry=2;this.src='SitePlan.jpg';}else if(this.dataset.retry==2){this.dataset.retry=3;this.src='site plan.jpg';}">
        
        <!-- Pinned Waypoints (Mapped to Architectural Positions) -->
        <button class="plan-pin" style="left: 64.0%; top: 28%;" onclick="selectFromSitePlan('cafe')" aria-label="Teleport to Cafe">
          <span class="pin-label" id="pin-cafe-title">Cafe</span>
        </button>

        <button class="plan-pin" style="left: 53.5%; top: 34%;" onclick="selectFromSitePlan('charpoy')" aria-label="Teleport to Charpoy">
          <span class="pin-label" id="pin-charpoy-title">Charpoy</span>
        </button>

        <button class="plan-pin" style="left: 77.0%; top: 30%;" onclick="selectFromSitePlan('totlot')" aria-label="Teleport to Totlot">
          <span class="pin-label" id="pin-totlot-title">Totlot</span>
        </button>
      </div>

      <!-- Quick Location Directory -->
      <div class="location-directory">
        <button class="dir-pill-btn" onclick="selectFromSitePlan('cafe')">
          <span style="color: var(--accent);">&bull;</span>
          <span data-i18n="cafe_short">Cafe</span>
        </button>
        <button class="dir-pill-btn" onclick="selectFromSitePlan('charpoy')">
          <span style="color: var(--accent);">&bull;</span>
          <span data-i18n="charpoy_short">Charpoy</span>
        </button>
        <button class="dir-pill-btn" onclick="selectFromSitePlan('totlot')">
          <span style="color: var(--accent);">&bull;</span>
          <span data-i18n="totlot_short">Totlot</span>
        </button>
      </div>
    </div>
  </div>

  <!-- ================= 5. A-FRAME 360 WEBXR SCENE ================= -->
  <a-scene embedded loading-screen="dotsColor: #2ecc71; backgroundColor: #0a0e14" vr-mode-ui="enabled: false">
    
    <!-- 360 Panorama Projection Sphere -->
    <a-sky id="skybox" radius="100" rotation="0 0 0"></a-sky>

    <!-- Hotspot Ring Container -->
    <a-entity id="waypoint-group"></a-entity>

    <!-- Camera Rig & Meta Quest Laser Controls -->
    <a-entity id="rig" position="0 1.6 0">
      <a-camera id="head" look-controls="pointerLockEnabled: false">
        <a-cursor
          id="cursor"
          geometry="primitive: ring; radiusInner: 0.015; radiusOuter: 0.025"
          material="color: #ffffff; shader: flat; opacity: 0.85"
          animation__fuse="property: scale; startEvents: fusing; easing: easeInCubic; dur: 1200; from: 1 1 1; to: 0.2 0.2 0.2"
          raycaster="objects: .clickable">
        </a-cursor>
      </a-camera>

      <!-- Quest Controllers -->
      <a-entity laser-controls="hand: right" raycaster="objects: .clickable; lineColor: #2ecc71; lineOpacity: 0.85"></a-entity>
      <a-entity laser-controls="hand: left" raycaster="objects: .clickable; lineColor: #2ecc71; lineOpacity: 0.85"></a-entity>
    </a-entity>
  </a-scene>

  <!-- ================= 6. APPLICATION CONTROLLER ================= -->
  <script>
    const tourData = [
      {
        id: "ariel",
        name: {
          en: "Ariel View",
          te: "ఏరియల్ వీక్షణ"
        },
        info: {
          en: "High-angle panoramic view showcasing the entire market site layout, road access, and landscape envelope.",

          {

          }
        ]
      },
      {

          te: "ఎరుపు రంగు నిర్మాణ శైలి మరియు బహిరంగ సీటింగ్‌తో కూడిన డైనింగ్ పెవిలియన్."

          {

            label: {

        ]
      },
      {
        id: "charpoy",

        },
        info: {

          te: "బహిరంగ ఆకాశం క్రింద రాతి పేవర్‌లతో కూడిన సాంప్రదాయ చార్‌పాయ్ సీటింగ్ కోర్ట్."
        },
        image: "Charpoy.jpg",
        rotation: "0 0 0",
        waypoints: [
          {
            target: "totlot",
            position: "5 0.15 -4",
            label: {
              en: "Go to Totlot",
              te: "టాట్‌లాట్‌కు వెళ్లండి"
            }
          },
          {
            target: "cafe",
            position: "-5 0.15 -4",
            label: {
              en: "Enter Cafe",
              te: "కేఫ్‌లోకి వెళ్లండి"
            }
          }
        ]
      },
      {
        id: "totlot",
        name: {
          en: "Totlot",
          te: "టాట్‌లాట్"
        },
        info: {
          en: "Shaded children's play park with playground furniture, stepping stone pathways, and tree canopies under arched roof covers.",
          te: "తోరణాల పైకప్పు కింద ఆట పరికరాలు మరియు నడక మార్గాలతో కూడిన పిల్లల ఆట స్థలం."
        },
        image: "Totlot.jpg",
        rotation: "0 0 0",
        waypoints: [
          {
            target: "charpoy",
            position: "0 0.15 -6",
            label: {
              en: "Go to Charpoy Area",
              te: "చార్‌పాయ్ ప్రాంతానికి వెళ్లండి"
            }
          }
        ]
      }
    ];

    const translations = {
      en: {
        eyebrow: "Virtual Reality Walkthrough",
        title: "Sardar Vallabhai Patel Market",
        subtitle: "virtual reality experience",
        start: "START TOUR",
        menu_home: "Home",
        menu_plan: "Top Plan",
        menu_vr: "VR Mode",
        siteplan_title: "Top Plan",
        siteplan_desc: "Select a location on the top plan to explore the 360° space.",
        info_tag: "About this place",
        cafe_short: "Cafe",
        charpoy_short: "Charpoy",
        totlot_short: "Totlot"
      },
      te: {
        eyebrow: "వర్చువల్ రియాలిటీ వాక్‌త్రూ",
        title: "సర్దార్ వల్లభాయ్ పటేల్ మార్కెట్",
        subtitle: "వర్చువల్ రియాలిటీ అనుభవం",
        start: "ప్రారంభించండి",
        menu_home: "హోమ్",
        menu_plan: "టాప్ ప్లాన్",
        menu_vr: "విఆర్ మోడ్",
        siteplan_title: "టాప్ ప్లాన్",
        siteplan_desc: "360° స్థలాన్ని చూడటానికి టాప్ ప్లాన్‌లోని స్థానాన్ని ఎంచుకోండి.",
        info_tag: "ఈ ప్రదేశం గురించి",
        cafe_short: "కేఫ్",
        charpoy_short: "చార్‌పాయ్",
        totlot_short: "టాట్‌లాట్"
      }
    };

    let currentLang = 'en';
    let activeSceneId = "ariel";
    let isTransitioning = false;

    const sky = document.querySelector('#skybox');
    const waypointGroup = document.querySelector('#waypoint-group');
    const aScene = document.querySelector('a-scene');
    const sidebar = document.querySelector('#sidebar-menu');
    const sitePlanModal = document.querySelector('#siteplan-modal');
    const modalBox = document.querySelector('#modal-box');
    const infoBtn = document.querySelector('#info-btn');
    const infoPanel = document.querySelector('#info-panel');

    function switchScene(sceneId) {
      if (isTransitioning) return;
      const scene = tourData.find(s => s.id === sceneId);
      if (!scene) return;
      isTransitioning = true;
      activeSceneId = sceneId;

      sky.setAttribute('animation__fadeout', {
        property: 'material.opacity',
        to: 0,
        dur: 280,
        easing: 'easeInOutQuad'
      });

      setTimeout(() => {
        sky.setAttribute('src', scene.image);
        sky.setAttribute('rotation', scene.rotation || '0 0 0');
        renderInfo(scene);
        renderWaypoints(scene.waypoints);

        sky.setAttribute('animation__fadein', {
          property: 'material.opacity',
          to: 1,
          dur: 280,
          easing: 'easeInOutQuad'
        });

        setTimeout(() => {
          isTransitioning = false;
        }, 300);
      }, 280);
    }

    function renderWaypoints(waypoints) {
      waypointGroup.innerHTML = '';
      if (!waypoints) return;

      waypoints.forEach(wp => {
        const wpEntity = document.createElement('a-entity');
        wpEntity.setAttribute('position', wp.position);
        
        wpEntity.innerHTML = `
          <a-ring 
            class="clickable" 
            radius-inner="0.32" 
            radius-outer="0.65" 
            color="#2ecc71" 
            rotation="-90 0 0" 
            material="opacity: 0.85; transparent: true">
          </a-ring>
          <a-text 
            value="${wp.label[currentLang]}" 
            position="0 0.8 0" 
            align="center" 
            scale="0.9 0.9 0.9" 
            color="#ffffff" 
            look-at="#head">
          </a-text>
        `;

        wpEntity.querySelector('.clickable').addEventListener('click', () => {
          switchScene(wp.target);
        });

        waypointGroup.appendChild(wpEntity);
      });
    }

    function renderInfo(scene) {
      document.querySelector('#info-title').innerText = scene.name[currentLang];
      document.querySelector('#info-text').innerText = scene.info[currentLang];
    }

    function openSitePlanModal() {
      sitePlanModal.classList.add('visible');
    }

    function closeSitePlanModal() {
      sitePlanModal.classList.remove('visible');
    }

    window.selectFromSitePlan = function(sceneId) {
      closeSitePlanModal();
      switchScene(sceneId);
    };

    function updateLanguage(lang) {
      currentLang = lang;
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (translations[lang][key]) {
          el.innerText = translations[lang][key];
        }
      });

      document.querySelector('#pin-cafe-title').innerText = translations[lang].cafe_short;
      document.querySelector('#pin-charpoy-title').innerText = translations[lang].charpoy_short;
      document.querySelector('#pin-totlot-title').innerText = translations[lang].totlot_short;

      const scene = tourData.find(s => s.id === activeSceneId);
      if (scene) {
        renderInfo(scene);
        renderWaypoints(scene.waypoints);
      }
    }

    // UI Listeners
    document.getElementById('btn-start').addEventListener('click', () => {
      document.getElementById('welcome-screen').classList.add('hidden');
      sidebar.classList.add('visible');
      infoBtn.classList.add('visible');
      switchScene(activeSceneId);
    });

    document.getElementById('btn-home').addEventListener('click', () => {
      closeSitePlanModal();
      infoPanel.classList.remove('open');
      infoBtn.classList.remove('open', 'visible');
      sidebar.classList.remove('visible');
      waypointGroup.innerHTML = '';
      activeSceneId = 'ariel';
      document.getElementById('welcome-screen').classList.remove('hidden');
    });

    infoBtn.addEventListener('click', () => {
      const open = infoPanel.classList.toggle('open');
      infoBtn.classList.toggle('open', open);
    });

    document.getElementById('btn-siteplan').addEventListener('click', openSitePlanModal);
    document.getElementById('btn-close-plan').addEventListener('click', closeSitePlanModal);

    sitePlanModal.addEventListener('click', (e) => {
      if (!modalBox.contains(e.target)) {
        closeSitePlanModal();
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && sitePlanModal.classList.contains('visible')) {
        closeSitePlanModal();
      }
    });

    document.getElementById('btn-vr').addEventListener('click', () => {
      if (aScene.enterVR) {
        aScene.enterVR();
      }
    });

    document.getElementById('btn-lang').addEventListener('click', () => {
      const nextLang = currentLang === 'en' ? 'te' : 'en';
      updateLanguage(nextLang);
    });
  </script>
</body>
</html>
