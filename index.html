<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Sardar Vallabhai Patel Market | 360 VR</title>
  
  <!-- A-Frame VR Framework -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>

  <style>
    :root {
      --bg-glass: rgba(15, 23, 42, 0.82);
      --border-glass: rgba(255, 255, 255, 0.2);
      --accent: #2ecc71;
      --text-main: #ffffff;
      --text-sub: #cbd5e1;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      color: var(--text-main);
    }

    /* ================= WELCOME SCREEN ================= */
    #welcome-screen {
      position: absolute;
      inset: 0;
      z-index: 2000; /* Highest priority to cover all HUDs */
      background-color: #0b0f14;
      background-image: 
        linear-gradient(180deg, rgba(10, 15, 25, 0.7) 0%, rgba(10, 15, 25, 0.3) 50%, rgba(0, 0, 0, 0.9) 100%),
        url('./welcome-hero.jpg');
      background-position: center center;
      background-repeat: no-repeat;
      background-size: cover;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 60px 24px;
      text-align: center;
      transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.8s;
    }

    #welcome-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .welcome-header {
      background: var(--bg-glass);
      padding: 28px 42px;
      border-radius: 20px;
      border: 1px solid var(--border-glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      max-width: 780px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.7);
    }

    .welcome-header h1 {
      font-size: 2.3rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 700;
      line-height: 1.25;
      text-shadow: 0 4px 16px rgba(0,0,0,0.9);
    }

    .welcome-header p {
      color: var(--text-sub);
      margin-top: 10px;
      font-size: 0.95rem;
      letter-spacing: 1.5px;
      text-transform: lowercase;
    }

    .welcome-footer {
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .btn-start {
      padding: 18px 56px;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: #fff;
      background: var(--bg-glass);
      border: 1.5px solid var(--accent);
      border-radius: 40px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(46, 204, 113, 0.4);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .btn-start:hover {
      background: var(--accent);
      color: #0b0f14;
      box-shadow: 0 0 38px rgba(46, 204, 113, 0.8);
      transform: translateY(-3px) scale(1.02);
    }

    /* ================= TRANSLUCENT LEFT MENU ================= */
    #sidebar-menu {
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 500;
      background: var(--bg-glass);
      border: 1px solid var(--border-glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 20px;
      padding: 14px 8px;
      display: none; /* Hidden on welcome screen by default */
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    #sidebar-menu.visible {
      display: flex;
    }

    .menu-item {
      background: transparent;
      border: none;
      color: var(--text-sub);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 12px;
      min-width: 64px;
      cursor: pointer;
      border-radius: 12px;
      transition: all 0.2s ease;
    }

    .menu-item svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
    }

    .menu-item span {
      font-size: 0.72rem;
      letter-spacing: 0.5px;
      font-weight: 500;
    }

    .menu-item:hover {
      background: rgba(255, 255, 255, 0.12);
      color: var(--accent);
      transform: scale(1.05);
    }

    /* ================= TOP SCENE BADGE ================= */
    #scene-indicator {
      position: absolute;
      top: 24px;
      left: 24px;
      z-index: 500;
      background: var(--bg-glass);
      border: 1px solid var(--border-glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 10px 22px;
      border-radius: 30px;
      font-size: 0.9rem;
      font-weight: 500;
      letter-spacing: 0.5px;
      display: none; /* Hidden until tour starts */
    }

    #scene-indicator.visible {
      display: block;
    }

    /* ================= SITE PLAN MODAL ================= */
    #siteplan-modal {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 800;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity 0.3s ease, visibility 0.3s;
    }

    #siteplan-modal.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .modal-content {
      background: var(--bg-glass);
      border: 1px solid var(--border-glass);
      padding: 30px;
      border-radius: 20px;
      max-width: 520px;
      width: 90%;
      text-align: center;
      position: relative;
    }

    .btn-close {
      position: absolute;
      top: 15px;
      right: 15px;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 1.6rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- ================= 1. WELCOME SCREEN ================= -->
  <section id="welcome-screen">
    <div class="welcome-header">
      <h1 data-i18n="title">Sardar Vallabhai Patel Market</h1>
      <p data-i18n="subtitle">virtual reality experience</p>
    </div>

    <div class="welcome-footer">
      <button id="btn-start" class="btn-start" data-i18n="start">START TOUR</button>
    </div>
  </section>

  <!-- ================= 2. ACTIVE VIEW TITLE ================= -->
  <div id="scene-indicator">
    <span id="current-scene-title">Historic Colonnade Corridor</span>
  </div>

  <!-- ================= 3. SINTRA-STYLE LEFT SIDEBAR ================= -->
  <nav id="sidebar-menu">
    <button class="menu-item" id="btn-home" title="Home View">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      <span data-i18n="menu_home">Home</span>
    </button>

    <button class="menu-item" id="btn-siteplan" title="Site Plan">
      <svg viewBox="0 0 24 24"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon><line x1="8" y1="2" x2="8" y2="18"></line><line x1="16" y1="6" x2="16" y2="22"></line></svg>
      <span data-i18n="menu_plan">Site Plan</span>
    </button>

    <button class="menu-item" id="btn-vr" title="Enter VR Mode">
      <svg viewBox="0 0 24 24"><path d="M4 7h16a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-3l-2.5-3h-5L7 17H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z"></path><circle cx="8" cy="12" r="1.5"></circle><circle cx="16" cy="12" r="1.5"></circle></svg>
      <span data-i18n="menu_vr">VR Mode</span>
    </button>

    <button class="menu-item" id="btn-lang" title="Toggle Language">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
      <span id="lang-label">EN / TE</span>
    </button>
  </nav>

  <!-- ================= 4. SITE PLAN MODAL ================= -->
  <div id="siteplan-modal" class="hidden">
    <div class="modal-content">
      <button class="btn-close" id="btn-close-plan">&times;</button>
      <h2 style="margin-bottom: 10px;" data-i18n="siteplan_title">Vantage Point Directory</h2>
      <p style="color: var(--text-sub); margin-bottom: 22px;" data-i18n="siteplan_desc">Jump directly to any architectural zone below:</p>
      <div style="display: flex; flex-direction: column; gap: 12px;">
        <button class="btn-start" style="padding: 12px 20px; font-size: 0.85rem;" onclick="switchScene('corridor'); document.getElementById('siteplan-modal').classList.add('hidden');">1. Historic Colonnade Corridor</button>
        <button class="btn-start" style="padding: 12px 20px; font-size: 0.85rem;" onclick="switchScene('courtyard'); document.getElementById('siteplan-modal').classList.add('hidden');">2. Multi-Level Timber Atrium</button>
      </div>
    </div>
  </div>

  <!-- ================= 5. A-FRAME 360 WEBXR SCENE ================= -->
  <a-scene embedded loading-screen="dotsColor: #2ecc71; backgroundColor: #0a0e14" vr-mode-ui="enabled: false">
    
    <!-- 360 Panorama Projection Sphere -->
    <a-sky id="skybox" radius="100" rotation="0 -90 0"></a-sky>

    <!-- Hotspot Ring Container -->
    <a-entity id="waypoint-group"></a-entity>

    <!-- Camera Rig & Controls -->
    <a-entity id="rig" position="0 1.6 0">
      <a-camera id="head" look-controls="pointerLockEnabled: false">
        <a-cursor
          id="cursor"
          geometry="primitive: ring; radiusInner: 0.015; radiusOuter: 0.025"
          material="color: #ffffff; shader: flat; opacity: 0.85"
          animation__fuse="property: scale; startEvents: fusing; easing: easeInCubic; dur: 1200; from: 1 1 1; to: 0.2 0.2 0.2"
          raycaster="objects: .clickable">
        </a-cursor>
      </a-camera>

      <!-- Meta Quest Controllers -->
      <a-entity laser-controls="hand: right" raycaster="objects: .clickable; lineColor: #2ecc71; lineOpacity: 0.85"></a-entity>
      <a-entity laser-controls="hand: left" raycaster="objects: .clickable; lineColor: #2ecc71; lineOpacity: 0.85"></a-entity>
    </a-entity>
  </a-scene>

  <!-- ================= 6. EMBEDDED TOUR LOGIC ================= -->
  <script>
    // Embedded Scene Data (Direct relative file paths in root repo)
    const tourData = [
      {
        id: "corridor",
        name: {
          en: "Historic Colonnade Corridor",
          te: "చారిత్రక స్తంభాల కారిడార్"
        },
        image: "corridor.jpg",
        rotation: "0 -90 0",
        waypoints: [
          {
            target: "courtyard",
            position: "0 0.2 -6",
            label: {
              en: "Enter Central Atrium",
              te: "సెంట్రల్ కోర్ట్‌యార్డ్‌లోకి వెళ్లండి"
            }
          }
        ]
      },
      {
        id: "courtyard",
        name: {
          en: "Multi-Level Timber Atrium",
          te: "మల్టీ లెవల్ టింబర్ కోర్ట్‌యార్డ్"
        },
        image: "courtyard.png",
        rotation: "0 0 0",
        waypoints: [
          {
            target: "corridor",
            position: "0 0.2 5",
            label: {
              en: "Return to Colonnade",
              te: "కారిడార్‌కు తిరిగి వెళ్ళండి"
            }
          }
        ]
      }
    ];

    const translations = {
      en: {
        title: "Sardar Vallabhai Patel Market",
        subtitle: "virtual reality experience",
        start: "START TOUR",
        menu_home: "Home",
        menu_plan: "Site Plan",
        menu_vr: "VR Mode",
        siteplan_title: "Vantage Point Directory",
        siteplan_desc: "Jump directly to any architectural zone below:"
      },
      te: {
        title: "సర్దార్ వల్లభాయ్ పటేల్ మార్కెట్",
        subtitle: "వర్చువల్ రియాలిటీ అనుభవం",
        start: "ప్రారంభించండి",
        menu_home: "హోమ్",
        menu_plan: "ప్లాన్",
        menu_vr: "విఆర్ మోడ్",
        siteplan_title: "ప్రదేశాల డైరెక్టరీ",
        siteplan_desc: "ఏదైనా ఆర్కిటెక్చరల్ ప్రాంతానికి వెళ్లడానికి కింద ఎంచుకోండి:"
      }
    };

    let currentLang = 'en';
    let activeSceneId = "corridor";

    const sky = document.querySelector('#skybox');
    const waypointGroup = document.querySelector('#waypoint-group');
    const currentSceneTitle = document.querySelector('#current-scene-title');
    const aScene = document.querySelector('a-scene');
    const sidebar = document.querySelector('#sidebar-menu');
    const indicator = document.querySelector('#scene-indicator');

    function switchScene(sceneId) {
      const scene = tourData.find(s => s.id === sceneId);
      if (!scene) return;
      activeSceneId = sceneId;

      sky.setAttribute('animation__fadeout', {
        property: 'material.opacity',
        to: 0,
        dur: 280,
        easing: 'easeInOutQuad'
      });

      setTimeout(() => {
        sky.setAttribute('src', scene.image);
        sky.setAttribute('rotation', scene.rotation || '0 0 0');
        currentSceneTitle.innerText = scene.name[currentLang];
        renderWaypoints(scene.waypoints);

        sky.setAttribute('animation__fadein', {
          property: 'material.opacity',
          to: 1,
          dur: 280,
          easing: 'easeInOutQuad'
        });
      }, 280);
    }

    function renderWaypoints(waypoints) {
      waypointGroup.innerHTML = '';
      if (!waypoints) return;

      waypoints.forEach(wp => {
        const wpEntity = document.createElement('a-entity');
        wpEntity.setAttribute('position', wp.position);
        
        wpEntity.innerHTML = `
          <a-ring 
            class="clickable" 
            radius-inner="0.32" 
            radius-outer="0.65" 
            color="#2ecc71" 
            rotation="-90 0 0" 
            material="opacity: 0.85; transparent: true">
          </a-ring>
          <a-text 
            value="${wp.label[currentLang]}" 
            position="0 0.8 0" 
            align="center" 
            scale="0.9 0.9 0.9" 
            color="#ffffff" 
            look-at="#head">
          </a-text>
        `;

        wpEntity.querySelector('.clickable').addEventListener('click', () => {
          switchScene(wp.target);
        });

        waypointGroup.appendChild(wpEntity);
      });
    }

    function updateLanguage(lang) {
      currentLang = lang;
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (translations[lang][key]) {
          el.innerText = translations[lang][key];
        }
      });

      const scene = tourData.find(s => s.id === activeSceneId);
      if (scene) {
        currentSceneTitle.innerText = scene.name[lang];
        renderWaypoints(scene.waypoints);
      }
    }

    // Start Tour & Reveal Navigation HUD
    document.getElementById('btn-start').addEventListener('click', () => {
      document.getElementById('welcome-screen').classList.add('hidden');
      sidebar.classList.add('visible');
      indicator.classList.add('visible');
      switchScene(activeSceneId);
    });

    document.getElementById('btn-home').addEventListener('click', () => {
      switchScene('corridor');
    });

    document.getElementById('btn-siteplan').addEventListener('click', () => {
      document.getElementById('siteplan-modal').classList.remove('hidden');
    });

    document.getElementById('btn-close-plan').addEventListener('click', () => {
      document.getElementById('siteplan-modal').classList.add('hidden');
    });

    document.getElementById('btn-vr').addEventListener('click', () => {
      if (aScene.enterVR) {
        aScene.enterVR();
      }
    });

    document.getElementById('btn-lang').addEventListener('click', () => {
      const nextLang = currentLang === 'en' ? 'te' : 'en';
      updateLanguage(nextLang);
    });
  </script>
</body>
</html>
