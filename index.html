<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Sardar Vallabhai Patel Market | 360 VR</title>
  
  <!-- A-Frame VR Framework -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>

  <style>
    :root {
      --bg-glass: rgba(15, 23, 42, 0.88);
      --border-glass: rgba(255, 255, 255, 0.2);
      --accent: #2ecc71;
      --accent-hover: #27ae60;
      --text-main: #ffffff;
      --text-sub: #cbd5e1;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      color: var(--text-main);
    }

    /* ================= 1. WELCOME SCREEN ================= */
    #welcome-screen {
      position: absolute;
      inset: 0;
      z-index: 2000;
      background-color: #0b0f14;
      background-image: 
        linear-gradient(90deg, rgba(10, 15, 25, 0.3) 0%, rgba(10, 15, 25, 0.85) 100%),
        url('./welcome-hero.jpg');
      background-position: center center;
      background-repeat: no-repeat;
      background-size: cover;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 40px 8%;
      transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.8s;
    }

    #welcome-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .welcome-card {
      background: var(--bg-glass);
      padding: 48px 42px;
      border-radius: 24px;
      border: 1px solid var(--border-glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      max-width: 540px;
      width: 100%;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      text-align: left;
      animation: fadeInRight 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .eyebrow-tag {
      font-size: 0.75rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 12px;
    }

    .welcome-card h1 {
      font-size: 2.2rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-weight: 800;
      line-height: 1.25;
      color: #ffffff;
      text-shadow: 0 4px 18px rgba(0,0,0,0.9);
      margin-bottom: 14px;
    }

    .welcome-card p {
      color: var(--text-sub);
      font-size: 0.95rem;
      letter-spacing: 1.2px;
      text-transform: lowercase;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .btn-start {
      padding: 16px 44px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #fff;
      background: rgba(46, 204, 113, 0.15);
      border: 1.5px solid var(--accent);
      border-radius: 40px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(46, 204, 113, 0.4);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: inline-flex;
      align-items: center;
      gap: 12px;
      transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .btn-start:hover {
      background: var(--accent);
      color: #0b0f14;
      box-shadow: 0 0 40px rgba(46, 204, 113, 0.85);
      transform: translateY(-2px);
    }

    /* ================= 2. TOP RIGHT INFO BUTTON & PANEL ================= */
    #info-btn {
      position: absolute;
      top: 24px;
      right: 24px;
      z-index: 500;
      width: 48px;
      height: 48px;
      border-radius: 50%;

      border: 1.5px solid var(--accent);
      color: #ffffff;

      font-weight: 700;
      font-style: italic;
      font-family: Georgia, "Times New Roman", serif;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
